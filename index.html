  @keyframes slideInLeft  { 0% { transform: translate3d(-8%, 0, 0) scale(.985); opacity: 0; } 60% { opacity: 1; } 100% { transform: translate3d(0,0,0) scale(1); opacity: 1; } }
  @keyframes fadeIn       { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }

  .slide-l { animation: slideInLeft  .42s cubic-bezier(0.32, 0.72, 0, 1) both; }

  .scroll-area::-webkit-scrollbar { width: 4px; height: 4px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .dot.off { background: var(--err); box-shadow: 0 0 8px rgba(255,69,58,.5); }

  .term .cmd { color: #7aa2f7; }

  .term .warn { color: #e0af68; }

  code.inline { font-family: var(--font-mono); font-size: 0.9em; padding: 1px 4px; background: var(--bg-3); border-radius: 4px; }

  // Connection status: "checking" | "online" | "offline"

  useEffect(() => { if (tab === "chat") endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy, tab]);
  useEffect(() => { if (tab === "openclaw") ocEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [ocMsgs, ocBusy, tab]);
  useEffect(() => { termEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [cmdLog]);

  /* ── OpenClaw real connection ─────────────────────────────────────── */
  // Try several common endpoints to detect if agent is alive
  async function pingOpenClaw(url) {
    if (!url) return { ok: false, ms: null };
    const start = performance.now();
    const candidates = ["/health", "/api/health", "/api/tags", "/v1/models", "/"];
    const base = url.replace(/\/+$/, "");
    for (const p of candidates) {
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 2500);
        const r = await fetch(base + p, { method: "GET", signal: ctrl.signal, mode: "cors" });
        clearTimeout(tid);
        if (r.ok || r.status === 404 || r.status === 405) {
          return { ok: true, ms: Math.round(performance.now() - start) };
        }
      } catch (e) { /* try next */ }
    }
    return { ok: false, ms: null };
  }

  async function checkOcStatus() {
    if (ocMode === "embedded") {
      // Embedded mode: check by pinging Gemini API key validity
      if (!geminiKey) { setOcStatus("offline"); setOcPingMs(null); return; }
      setOcStatus("checking");
      const start = performance.now();
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 4000);
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(geminiKey)}`, { method: "GET", signal: ctrl.signal });
        clearTimeout(tid);
        setOcStatus(r.ok ? "online" : "offline");
        setOcPingMs(r.ok ? Math.round(performance.now() - start) : null);
      } catch {
        setOcStatus("offline"); setOcPingMs(null);
      }
      return;
    }

  // Embedded mode — call Gemini API directly. App jadi self-contained agent (OpenClaw embedded di APK).
  async function callGeminiEmbedded(text, history) {
    if (!geminiKey) return "⚠️ Gemini API key belum di-set. Buka Tools → OpenClaw Agent, pilih mode **Embedded**, masukkan API key dari https://aistudio.google.com/apikey";
    const sys = `Kamu adalah OpenClaw Agent, AI asisten yang sudah di-embed dalam APK "Bot Tele MultiAI" punya IKy di Batam. Berbasis Gemini, mampu reasoning, koding, drawio diagram, network ops (PROXINET), terminal/shell guidance. Gaya: praktis, teknis, ringkas, Bahasa Indonesia kasual. Mulai jawaban dengan emoji 🐾 kalau cocok.`;
    const contents = [...(history || []).slice(-8).map(m => ({
      role: m.role === "agent" ? "model" : "user",
      parts: [{ text: m.text }]
    })), { role: "user", parts: [{ text }] }];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(geminiModel)}:generateContent?key=${encodeURIComponent(geminiKey)}`;
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 60000);
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: sys }] },
          contents,
          generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        }),
        signal: ctrl.signal
      });
      clearTimeout(tid);
      if (!res.ok) {
        const t = await res.text();
        setOcStatus("offline");
        return `⚠️ Gemini API error (${res.status}): ${t.slice(0, 200)}`;
      }
      const d = await res.json();
      const reply = d?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "🐾 (no reply)";
      setOcStatus("online");
      return reply;
    } catch (e) {
      setOcStatus("offline");
      return `⚠️ Embedded agent error: ${e.message}`;
    }
  }

  // Direct call to OpenClaw — tries multiple API formats automatically
  async function callOpenClawDirect(text, history) {
    // Embedded mode wins — OpenClaw jadi part of APK, no external server needed
    if (ocMode === "embedded") return callGeminiEmbedded(text, history);

    const base = (ocUrl || "").replace(/\/+$/, "");
    if (!base) return "⚠️ OpenClaw URL belum di-set. Buka Tools → OpenClaw Agent.";
    const fmt = ocFormat || "auto";
    const tries = [];
    // Order based on user preference
    if (fmt === "auto" || fmt === "openai") tries.push("openai");
    if (fmt === "auto" || fmt === "ollama-chat") tries.push("ollama-chat");
    if (fmt === "auto" || fmt === "ollama-gen") tries.push("ollama-gen");
    if (fmt === "auto" || fmt === "anthropic") tries.push("anthropic");
    if (fmt === "auto" || fmt === "simple") tries.push("simple");

    const msgHist = (history || []).slice(-6).map(m => ({
      role: m.role === "agent" ? "assistant" : (m.role === "user" ? "user" : "system"),
      content: m.text
    }));
    const messages = [...msgHist, { role: "user", content: text }];

    let lastErr = null;
    for (const t of tries) {
      try {
        let url, body;
        if (t === "openai") {
          url = base + "/v1/chat/completions";
          body = { model: ocModel, messages, stream: false };
        } else if (t === "ollama-chat") {
          url = base + "/api/chat";
          body = { model: ocModel, messages, stream: false };
        } else if (t === "ollama-gen") {
          url = base + "/api/generate";
          body = { model: ocModel, prompt: text, stream: false };
        } else if (t === "anthropic") {
          url = base + "/v1/messages";
          body = { model: ocModel, max_tokens: 1024, messages };
        } else if (t === "simple") {
          url = base + "/chat";
          body = { prompt: text, message: text, model: ocModel };
        }
        const headers = { "Content-Type": "application/json" };
        if (apiKey) headers["Authorization"] = `Bearer ${apiKey}`;
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 60000);
        const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: ctrl.signal, mode: "cors" });
        clearTimeout(tid);
        if (!res.ok) { lastErr = `${t}: HTTP ${res.status}`; continue; }
        const d = await res.json();
        // Extract response from various shapes
        const reply =
          d?.choices?.[0]?.message?.content ||
          d?.choices?.[0]?.text ||
          d?.message?.content ||
          d?.content?.[0]?.text ||
          d?.response ||
          d?.reply ||
          d?.text ||
          d?.output ||
          (typeof d === "string" ? d : null);
        if (reply) {
          setOcStatus("online");
          return reply;
        }
        lastErr = `${t}: respons kosong/format tidak dikenal`;
      } catch (e) {
        lastErr = `${t}: ${e.message}`;
      }
    }
    setOcStatus("offline");
    return `⚠️ Gagal connect ke OpenClaw (${ocUrl}).\n\nDetail: ${lastErr || "no response"}\n\nCek: (1) agent jalan di URL itu, (2) port terbuka, (3) CORS allowed, (4) coba ganti format API di Tools.`;
  }

              const items = Object.entries(PROVIDERS).filter(([, v]) => v.group === grp);
              return (
                <div key={grp} style={{ marginBottom: 14 }}>
                  <p style={{ margin: "0 4px 6px", fontSize: 10, color: "var(--txt-3)", fontWeight: 500 }}>{grp.toUpperCase()}</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                    {items.map(([id, pr]) => (
                      <button key={id} onClick={() => switchPid(id)} style={{
                        display: "flex", flexDirection: "column", padding: 11,
                        background: id === pid ? "var(--info-bg)" : "var(--bg-2)",
                        border: `0.5px solid ${id === pid ? "var(--info-bd)" : "var(--bd-1)"}`,
                        borderRadius: 12, cursor: "pointer", textAlign: "left"
                      }}>
                        <span style={{ fontSize: 18, marginBottom: 5 }}>{pr.icon}</span>
                        <p style={{ margin: 0, fontSize: 12, fontWeight: id === pid ? 600 : 500, color: id === pid ? "var(--info)" : "var(--txt-1)" }}>{pr.name}</p>
                        <p style={{ margin: 0, fontSize: 10, color: id === pid ? "var(--info)" : "var(--txt-3)" }}>{pr.desc}</p>
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}

            <button className="ios-btn" onClick={() => setScreen("providers")} style={{ width: "100%", padding: 11, marginBottom: 16, fontSize: 12, fontWeight: 500, color: "var(--txt-2)", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
              Lihat semua {Object.keys(PROVIDERS).length} provider <Icon name="chev" size={13} />
            </button>

            <p style={{ margin: "0 4px 8px", fontSize: 11, fontWeight: 600, color: "var(--txt-3)", letterSpacing: "0.04em", textTransform: "uppercase" }}>Bot Control</p>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <button onClick={() => { setMsgs([{ role: "bot", text: "🔄 Bot sedang restart...\n\n✅ Bot berhasil direstart!\n\nAI aktif: " + p.icon + " *" + p.name + "*", time: fmtTime() }]); changeTab("chat"); }} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: 11, background: "var(--warn-bg)", border: "0.5px solid var(--warn-bd)", borderRadius: 12, cursor: "pointer", fontSize: 12, color: "var(--warn)", fontWeight: 600 }}>
                <Icon name="reboot" size={13} /> Restart Bot
              </button>
              <button className="ios-btn" onClick={() => { setMsgs([]); changeTab("chat"); }} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: 11, borderRadius: 12, fontSize: 12, color: "var(--txt-2)", fontWeight: 600 }}>
                <Icon name="x" size={13} /> Clear Chat
              </button>
            </div>

            <p style={{ margin: "0 4px 8px", fontSize: 11, fontWeight: 600, color: "var(--txt-3)", letterSpacing: "0.04em", textTransform: "uppercase" }}>Commands</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
              {[["/start", "Menu utama"], ["/ai", "Ganti AI provider"], ["/status", "CPU, RAM & Disk"], ["/screenshot", "Screenshot laptop"], ["/cmd <perintah>", "Jalankan terminal"], ["/files [path]", "List isi folder"], ["/openclaw <task>", "Kirim task ke OpenClaw"], ["/tokens", "Cek kredit semua AI"], ["/clear", "Hapus riwayat chat"]].map(([c, d], i) => (
                <div key={i} className="ios-card" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 13px" }}>
                  <code style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--info)", fontWeight: 600 }}>{c}</code>
                  <span style={{ fontSize: 11, color: "var(--txt-2)" }}>{d}</span>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>

      {/* Bottom Nav */}
      <div className="nav-blur" style={{ display: "flex", borderTop: "0.5px solid var(--bd-1)", position: "sticky", bottom: 0 }}>
        {[
          { id: "chat",     icon: "msg",      label: "Chat" },
          { id: "vps",      icon: "server",   label: "VPS" },
          { id: "openclaw", icon: "layers",   label: "OpenClaw" },
          { id: "files",    icon: "folder",   label: "Files" },
          { id: "settings", icon: "settings", label: "Tools" },
        ].map(b => (
          <button key={b.id} onClick={() => changeTab(b.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", padding: "9px 4px", background: "none", border: "none", cursor: "pointer", color: tab === b.id ? "var(--info)" : "var(--txt-3)", transition: "color .2s cubic-bezier(0.32, 0.72, 0, 1)" }}>
            <Icon name={b.icon} size={20} strokeWidth={tab === b.id ? 2.4 : 2} />
            <span style={{ fontSize: 10, marginTop: 3, fontWeight: tab === b.id ? 600 : 500 }}>{b.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
// Service worker (offline-first PWA support)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
